server:
  port: 8081

spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:neuroforge-nexus-development-secret-key-2026}
  expiration-ms: 86400000

  spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer