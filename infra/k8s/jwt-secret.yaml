# Shared JWT signing secret for user-service AND cicd-service.
# Both deployments read key "jwt-secret" from this Secret, so tokens issued
# by user-service always verify in cicd-service.
#
# Prefer creating it imperatively with a real value instead of applying this
# manifest:
#   kubectl -n production create secret generic nexus-jwt-secret \
#     --from-literal=jwt-secret="<64+ char random string>"
#
# If you apply this file as-is, REPLACE the placeholder first — never commit
# a real secret here.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-jwt-secret
  namespace: production
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_REAL_SHARED_SECRET_MIN_32_CHARS"
