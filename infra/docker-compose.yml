services:
  mongodb:
    image: mongo:7.0
    container_name: nexus-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexus_user_db
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nexus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nexus-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  user-service:
    build:
      context: ../backend/user-service
    container_name: nexus-user-service
    restart: always
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://mongodb:27017/nexus_user_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Shared signing secret - MUST be identical to the one given to
      # cicd-service. Override via the JWT_SECRET host env var (or a .env
      # file next to this compose file) for anything but local dev.
      JWT_SECRET: ${JWT_SECRET:-neuroforge-nexus-development-secret-key-2026}
      # GitHub OAuth app settings. Register the callback URL exactly in GitHub.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: "${GITHUB_OAUTH_CALLBACK_URL:-http://localhost:8081/github/oauth/callback}"
      GITHUB_OAUTH_FRONTEND_URL: "${GITHUB_OAUTH_FRONTEND_URL:-http://localhost:5173}"
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_WEBHOOK_PUBLIC_URL: ${GITHUB_WEBHOOK_PUBLIC_URL:-}

  cicd-service:
    build:
      context: ../backend/cicd-service
    container_name: nexus-cicd-service
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8083:8083"
    environment:
      MONGO_URI: mongodb://mongodb:27017/nexus_cicd_db
      # Same shared secret as user-service - MUST stay identical.
      JWT_SECRET: ${JWT_SECRET:-neuroforge-nexus-development-secret-key-2026}

volumes:
  mongo_data:
