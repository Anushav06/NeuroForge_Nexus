server:
  port: 8083

spring:
  application:
    name: cicd-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/nexus_cicd_db}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true

jwt:
  secret: ${JWT_SECRET:neuroforge-nexus-development-secret-key-2026}
  expiration-ms: 86400000